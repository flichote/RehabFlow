# ============================================================
# RehabFlow Nginx 站点配置 — Linux 常规部署（systemd 服务）
# 安装：sudo cp deploy/nginx/rehabflow.conf /etc/nginx/conf.d/rehabflow.conf
#       sudo nginx -t && sudo systemctl reload nginx
# 拓扑：:80 → 前端(127.0.0.1:3000) + 后端 API(127.0.0.1:8000)
# ============================================================

# 后端 API（systemd 服务监听 127.0.0.1:8000）
upstream rehabflow_backend {
    server 127.0.0.1:8000;
}

# 前端 Next.js（systemd 服务监听 127.0.0.1:3000）
upstream rehabflow_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;

    # 字符集
    charset utf-8;

    # 请求体上限（课程/评估文本足够）
    client_max_body_size 10m;

    # 健康检查
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"rehabflow"}';
    }

    # API 直接反代后端（同源，无跨域）
    location /api/ {
        proxy_pass http://rehabflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js 静态资源（_next 下带 hash，可长缓存）
    location /_next/static/ {
        proxy_pass http://rehabflow_frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 其余页面 → Next.js
    location / {
        proxy_pass http://rehabflow_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
