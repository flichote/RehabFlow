# RehabFlow Nginx 配置 — 对外服务入口（容器内 80 端口）
# 静态资源由 nginx 直出；页面与 /api 反代到 Next.js standalone（3000）；/api 直连后端（8000）
# 同源架构：浏览器只看到本机 80，无跨域问题

# 后端 upstream（docker-compose 网络内服务名）
upstream rehabflow_backend {
    server backend:8000;
}

upstream rehabflow_next {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # 静态资源：Next.js 产物直接由 nginx 服务（性能更好）
    location /_next/static/ {
        alias /app/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查（容器 HEALTHCHECK 使用；不落日志）
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"rehabflow"}';
    }

    # API 直接反代后端（跳过 Next 层，少一跳）
    location /api/ {
        proxy_pass http://rehabflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 其余页面 → Next.js standalone
    location / {
        proxy_pass http://rehabflow_next;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";  # HMR/SSE 兼容
        proxy_read_timeout 60s;
    }
}
